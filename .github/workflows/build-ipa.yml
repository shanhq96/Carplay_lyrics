# Builds an UNSIGNED .ipa of CarPlay Lyrics for sideloading
# (Sideloadly / AltStore / SideStore re-sign it with your own Apple ID).
#
# Put this file at .github/workflows/build-ipa.yml in your fork of
# https://github.com/atsaini-lrnr/Carplay_lyrics, then go to
# Actions → "Build unsigned IPA" → Run workflow.

name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["**.md"]

jobs:
  build:
    # The project needs Xcode 27 (project format 110, iOS 26 SDK).
    runs-on: xcode-27   # GitHub preview image with Xcode 27 (macos-26 only has Xcode 26)
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v5

      - name: Select newest installed Xcode 27
        run: |
          XCODE=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$XCODE" ]; then
            echo "::error::No Xcode 27 on this runner. Installed Xcodes:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Build (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project CarPlayLyrics.xcodeproj \
            -scheme CarPlayLyrics \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build | tee xcodebuild.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/CarPlayLyrics.app

      - name: Package .ipa
        run: |
          APP=build/Build/Products/Release-iphoneos/CarPlayLyrics.app
          echo "Embedded extensions:"; ls "$APP/PlugIns" || echo "(none – widget missing!)"
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out && zip -qry CarPlayLyrics-unsigned.ipa Payload
          ls -lh CarPlayLyrics-unsigned.ipa

      - uses: actions/upload-artifact@v5
        with:
          name: CarPlayLyrics-unsigned-ipa
          path: out/CarPlayLyrics-unsigned.ipa
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore
